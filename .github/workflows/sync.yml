name: Sync starred repositories

on:
  schedule:
    # Fixed EET (UTC+02:00): 00:00 and 14:00 EET daily.
    - cron: '0 22 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-radar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test sync logic
        run: python -m unittest discover -s tests -v

      - name: Import new stars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync.py --user AndyTheFactory --max-new 50

      - name: Check pending Copilot enrichment
        id: pending
        run: |
          count=$(find catalog -type f -name '*.md' ! -path 'catalog/AndyTheFactory/*' -exec grep -L 'github-radar:enrichment:start' {} + 2>/dev/null | wc -l || true)
          echo "has_pending=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Pending: $count"

      - name: Install Copilot runtime
        if: steps.pending.outputs.has_pending == 'true' && env.COPILOT_TOKEN != ''
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: npm install -g @github/copilot

      - name: Install Python Copilot SDK
        if: steps.pending.outputs.has_pending == 'true' && env.COPILOT_TOKEN != ''
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: python -m pip install -r requirements-enrichment.txt

      - name: Enrich pending entries
        id: enrich
        continue-on-error: true
        if: steps.pending.outputs.has_pending == 'true' && env.COPILOT_TOKEN != ''
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          COPILOT_MODEL: ${{ vars.COPILOT_MODEL || 'cheapest' }}
        run: python scripts/enrich.py --limit 10

      - name: Rebuild category indexes
        run: python scripts/build_categories.py

      - name: Commit catalog updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A catalog/ CATALOG.md CATEGORIES.md categories/
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync starred repositories"
            # The branch may advance while a long sync runs.
            # Rebase on the latest main before pushing, with bounded retries.
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Catalog pushed successfully"
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "Push failed after 4 attempts" >&2
                exit 1
              fi
              sleep $((attempt * 3))
            done
          else
            echo "Catalog already up to date"
          fi

      - name: Report enrichment failure
        if: steps.enrich.outcome == 'failure'
        run: |
          echo "Copilot enrichment failed for one or more entries; successful entries were committed." >&2
          exit 1
