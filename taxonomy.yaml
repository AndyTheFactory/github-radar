# Open vocabulary. Normalize aliases using the map below; don't invent
# technologies or infer technologies from a repository's domain.
technology_aliases:
  py: python
  python3: python
  js: javascript
  ts: typescript
  node: nodejs
  node.js: nodejs
  react.js: react
  next.js: nextjs
  postgresql: postgres
  postgres: postgres
  pytorch: pytorch
  torch: pytorch
  tensorflow: tensorflow
  k8s: kubernetes
  hf-transformers: transformers
  github-actions: github-actions

classification_limits:
  secondary_domains: 2
  capabilities: 5
  technologies: 8
  use_cases: 3

# Classification is allowed to be incomplete rather than speculative.
unknown_value: null
