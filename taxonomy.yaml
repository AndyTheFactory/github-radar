# GitHub Radar taxonomy v1
# Stable, human-reviewed controlled vocabulary. Do not extend automatically.
version: 1

domains:
  ai-ml: "AI & Machine Learning"
  data-engineering: "Data Engineering & Analytics"
  developer-tools: "Developer Tools"
  infrastructure: "Infrastructure & DevOps"
  databases: "Databases, Storage & Search"
  security: "Security & Privacy"
  applications: "Applications & Web/Mobile"
  vision-media: "Computer Vision & Multimedia"
  scientific-computing: "Scientific Computing & Simulation"
  games: "Games & Interactive Media"
  hardware: "Hardware, Embedded & Robotics"
  research-learning: "Research, Education & Reference"
  creative: "Creative Tools & Digital Art"
  productivity: "Productivity & Personal Tools"
  miscellanea: "Miscellanea"
  other: "Unknown / Unclassified"

repository_types:
  library: "Library or framework intended for reuse"
  application: "End-user, desktop, mobile or CLI application"
  service: "Deployable service, server or platform"
  dataset: "Dataset or benchmark collection"
  research: "Research or experimental implementation"
  resource: "Documentation, tutorials or curated lists"
  template: "Template, example project or boilerplate"
  game: "Playable game or game engine project"
  hardware: "Hardware design, firmware or embedded project"
  collection: "Collection of resources or multiple independent projects"
  other: "Type cannot be established"

